# Локальный запуск одной командой:  docker compose up
# Сайт:    http://localhost:3000
# Админка: http://localhost:3000/admin  (admin@dsg.ge / admin12345)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dsg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dsg']
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dsg
      PAYLOAD_SECRET: local-dev-secret-change-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_ADMIN_PASSWORD: admin12345
      SEED_ONLY_IF_EMPTY: '1'
      CI: 'true'
    # Устанавливает зависимости, при первом запуске заполняет базу демо-данными и запускает сайт
    command: sh -c "corepack enable && corepack prepare pnpm@10.28.0 --activate && pnpm install --frozen-lockfile && pnpm seed && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
